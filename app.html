<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oogway</title>
  <link rel="stylesheet" href="assets/css/themes.css" />
  <script>window.OOGWAY_API = "https://oogway-gc-api.vercel.app";</script>
  <script src="https://isaiahnoelpulidosalazar.github.io/js/ECStyleSheet.js"></script>
  <script src="https://isaiahnoelpulidosalazar.github.io/js/ECElements.js"></script>
</head>
<body>

<div class="app-layout" id="app-layout">
  <!-- ── SIDEBAR ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span>🐢</span>
      <span>Oogway</span>
    </div>
    <button class="sidebar-nav-item active" data-page="home">
      <span class="icon">🏠</span><span>Home</span>
    </button>
    <button class="sidebar-nav-item" data-page="activities">
      <span class="icon">📅</span><span>Activities</span>
    </button>
    <button class="sidebar-nav-item" data-page="minigames">
      <span class="icon">🎮</span><span>Mini Games</span>
    </button>
    <button class="sidebar-nav-item" data-page="messages">
      <span class="icon">💬</span><span>Messages</span>
      <span class="sidebar-badge" id="msg-badge" style="display:none">0</span>
    </button>
    <button class="sidebar-nav-item" data-page="profile">
      <span class="icon">👤</span><span>Profile</span>
    </button>
    <button class="sidebar-nav-item" data-page="settings">
      <span class="icon">⚙️</span><span>Settings</span>
    </button>
  </aside>

  <!-- ── MAIN CONTENT ──────────────────────────────────────────── -->
  <div class="main-content">
    <!-- TOPBAR (custom, not ECTopbar) -->
    <div class="topbar" id="topbar">
      <div class="topbar-user" id="topbar-user">
        <div class="avatar" id="topbar-avatar">?</div>
        <div>
          <div style="font-size:14px;font-weight:700" id="topbar-name">Loading...</div>
          <div style="font-size:12px;color:var(--text-muted)" id="topbar-handle">@...</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="topbar-icon-btn" id="notif-btn" title="Notifications">
          🔔
          <span class="notif-badge" id="notif-badge" style="display:none">0</span>
        </button>
        <button class="topbar-icon-btn" id="logout-btn" title="Log out" style="font-size:16px">🚪</button>
      </div>
    </div>

    <!-- PAGE AREA -->
    <div class="page-area" id="page-area">
      <div class="spinner"></div>
    </div>
  </div>
</div>

<!-- NOTIFICATIONS MODAL -->
<div class="modal-overlay" id="notif-modal">
  <div class="modal-box" style="min-width:360px;max-width:480px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="modal-title" style="margin-bottom:0">Notifications</div>
      <button class="btn btn-sm btn-ghost" id="notif-read-all-btn">Mark all read</button>
    </div>
    <div id="notif-list"><div class="spinner"></div></div>
  </div>
</div>

<!-- COMMENTS MODAL -->
<div class="modal-overlay" id="comments-modal">
  <div class="modal-box" style="min-width:360px;max-width:520px">
    <div class="modal-title">Comments</div>
    <div id="comments-list" style="margin-bottom:12px;max-height:340px;overflow-y:auto"></div>
    <div style="display:flex;gap:8px">
      <input type="text" id="comment-input" placeholder="Write a comment..." />
      <button class="btn btn-primary btn-sm" id="comment-send-btn">Send</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="assets/js/api.js"></script>

<!-- Page modules -->
<script src="assets/js/pages/home.js"></script>
<script src="assets/js/pages/activities.js"></script>
<script src="assets/js/pages/minigames.js"></script>
<script src="assets/js/pages/messages.js"></script>
<script src="assets/js/pages/profile.js"></script>
<script src="assets/js/pages/settings.js"></script>

<script>
(async function() {
  // Guard
  if (!OogwayAPI.getSession()) { location.href = "index.html"; return; }

  const { getUser } = OogwayAPI;
  let currentUser = null;
  let currentPage = "home";
  let commentPostId = null;

  // ── TOAST ──────────────────────────────────────────────────────
  window.toast = function(msg, type) {
    const c = document.getElementById("toast-container");
    const t = document.createElement("div");
    t.className = "toast " + (type || "");
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3200);
  };

  // ── THEME ──────────────────────────────────────────────────────
  window.applyTheme = function(theme) {
    document.documentElement.setAttribute("data-theme", theme || "light-multi");
  };

  // ── INIT USER ──────────────────────────────────────────────────
  try {
    currentUser = await OogwayAPI.Auth.me();
  } catch(e) {
    OogwayAPI.Auth.logout();
    return;
  }
  applyTheme(currentUser.theme || "light-multi");
  window.CURRENT_USER = currentUser;

  // Topbar
  const avatarEl = document.getElementById("topbar-avatar");
  if (currentUser.avatar_base64) {
    avatarEl.innerHTML = `<img src="${currentUser.avatar_base64}" alt="" />`;
  } else {
    avatarEl.textContent = (currentUser.first_name[0] + currentUser.last_name[0]).toUpperCase();
  }
  document.getElementById("topbar-name").textContent = currentUser.first_name + " " + currentUser.last_name;
  document.getElementById("topbar-handle").textContent = "@" + currentUser.username;

  // ── NOTIFICATIONS ──────────────────────────────────────────────
  async function pollNotifications() {
    try {
      const { count } = await OogwayAPI.Notifications.unreadCount();
      const badge = document.getElementById("notif-badge");
      if (count > 0) { badge.textContent = count; badge.style.display = ""; }
      else badge.style.display = "none";
    } catch(e) {}
  }
  pollNotifications();
  setInterval(pollNotifications, 30000);

  document.getElementById("notif-btn").addEventListener("click", async () => {
    document.getElementById("notif-modal").classList.add("open");
    await loadNotifications();
    OogwayAPI.Notifications.readAll().then(pollNotifications).catch(() => {});
  });
  document.getElementById("notif-read-all-btn").addEventListener("click", async () => {
    await OogwayAPI.Notifications.readAll();
    await loadNotifications();
    pollNotifications();
  });
  document.getElementById("notif-modal").addEventListener("click", e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove("open");
  });

  async function loadNotifications() {
    const list = document.getElementById("notif-list");
    list.innerHTML = '<div class="spinner"></div>';
    try {
      const { notifications } = await OogwayAPI.Notifications.list();
      if (!notifications.length) { list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:20px">No notifications yet.</p>'; return; }
      list.innerHTML = notifications.map(n => {
        const typeEmoji = n.type === "like" ? "❤️" : n.type === "comment" ? "💬" : "➕";
        const typeText = n.type === "like" ? "liked your post" : n.type === "comment" ? "commented on your post" : "started following you";
        return `<div class="notif-item ${n.is_read ? "" : "unread"}">
          <div class="avatar" style="width:36px;height:36px;font-size:13px">${n.actor_avatar ? `<img src="${n.actor_avatar}">` : (n.actor_first_name[0]+n.actor_last_name[0]).toUpperCase()}</div>
          <div style="flex:1">
            <span style="font-weight:600">${n.actor_first_name} ${n.actor_last_name}</span>
            <span style="color:var(--text-muted);font-size:13px"> ${typeText}</span>
          </div>
          <span style="font-size:18px">${typeEmoji}</span>
        </div>`;
      }).join("");
    } catch(e) { list.innerHTML = '<p style="color:#ef4444;padding:16px">Failed to load notifications.</p>'; }
  }

  // ── COMMENTS MODAL ─────────────────────────────────────────────
  window.openComments = async function(postId) {
    commentPostId = postId;
    document.getElementById("comments-modal").classList.add("open");
    await loadComments(postId);
  };
  document.getElementById("comments-modal").addEventListener("click", e => {
    if (e.target === e.currentTarget) { e.currentTarget.classList.remove("open"); commentPostId = null; }
  });
  document.getElementById("comment-send-btn").addEventListener("click", async () => {
    const input = document.getElementById("comment-input");
    const content = input.value.trim();
    if (!content || !commentPostId) return;
    try {
      await OogwayAPI.Posts.comment({ post_id: commentPostId, content });
      input.value = "";
      await loadComments(commentPostId);
      toast("Comment added!", "success");
    } catch(e) { toast("Failed to post comment.", "error"); }
  });
  document.getElementById("comment-input").addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("comment-send-btn").click();
  });

  async function loadComments(postId) {
    const list = document.getElementById("comments-list");
    list.innerHTML = '<div class="spinner" style="margin:12px auto"></div>';
    try {
      const { comments } = await OogwayAPI.Posts.comments(postId);
      if (!comments.length) { list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:8px">No comments yet. Be the first!</p>'; return; }
      list.innerHTML = comments.map(c => `
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <div class="avatar" style="width:30px;height:30px;font-size:11px;flex-shrink:0">${c.avatar_base64 ? `<img src="${c.avatar_base64}">` : (c.first_name[0]+c.last_name[0]).toUpperCase()}</div>
          <div>
            <span style="font-weight:600;font-size:13px">${c.first_name} ${c.last_name}</span>
            <span style="color:var(--text-muted);font-size:11px;margin-left:6px">${timeAgo(c.created_at)}</span>
            <div style="font-size:13.5px;margin-top:2px">${escHtml(c.content)}</div>
          </div>
        </div>`).join("");
    } catch(e) { list.innerHTML = '<p style="color:#ef4444">Failed to load comments.</p>'; }
  }

  // ── HELPERS ─────────────────────────────────────────────────────
  window.timeAgo = function(dateStr) {
    const d = new Date(dateStr);
    const diff = Math.floor((Date.now() - d) / 1000);
    if (diff < 60) return "just now";
    if (diff < 3600) return Math.floor(diff/60) + "m ago";
    if (diff < 86400) return Math.floor(diff/3600) + "h ago";
    return Math.floor(diff/86400) + "d ago";
  };
  window.escHtml = function(s) {
    return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  };
  window.avatarHtml = function(user, size) {
    size = size || 40;
    const initials = ((user.first_name||"?")[0] + (user.last_name||"?")[0]).toUpperCase();
    return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.floor(size*0.35)}px;border:2px solid var(--accent1)">
      ${user.avatar_base64 ? `<img src="${user.avatar_base64}" />` : initials}
    </div>`;
  };

  // ── LOGOUT ─────────────────────────────────────────────────────
  document.getElementById("logout-btn").addEventListener("click", async () => {
    if (!confirm("Log out?")) return;
    await OogwayAPI.Auth.logout();
  });

  // ── PAGE NAVIGATION ────────────────────────────────────────────
  window.navigateTo = function(page, params) {
    currentPage = page;
    document.querySelectorAll(".sidebar-nav-item").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.page === page);
    });
    const area = document.getElementById("page-area");
    area.innerHTML = '<div class="spinner"></div>';
    const pages = { home: window.PageHome, activities: window.PageActivities, minigames: window.PageMinigames, messages: window.PageMessages, profile: window.PageProfile, settings: window.PageSettings };
    if (pages[page]) pages[page].render(area, currentUser, params);
  };

  document.querySelectorAll(".sidebar-nav-item").forEach(btn => {
    btn.addEventListener("click", () => navigateTo(btn.dataset.page));
  });

  // Initial page
  navigateTo("home");
})();
</script>
</body>
</html>
