<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oogway – Login</title>
  <link rel="stylesheet" href="assets/css/themes.css" />
  <script>window.OOGWAY_API = "https://oogway-gc-api.vercel.app";</script>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
    .auth-wrap { width: 100%; max-width: 420px; padding: 16px; }
    .auth-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: 24px; padding: 36px 32px; box-shadow: var(--shadow); }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-text { font-size: 34px; font-weight: 900; background: var(--btn-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -1px; }
    .auth-logo .tagline { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid var(--border); }
    .tab { flex: 1; padding: 10px; text-align: center; font-weight: 600; font-size: 14.5px; cursor: pointer; color: var(--text-muted); border-bottom: 2.5px solid transparent; margin-bottom: -2px; transition: color 0.15s, border-color 0.15s; }
    .tab.active { color: var(--accent1); border-color: var(--accent1); }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .name-row { display: flex; gap: 10px; }
    .name-row .form-group { flex: 1; }
    .btn-primary { width: 100%; padding: 12px; font-size: 15px; margin-top: 6px; }
    .divider { text-align: center; color: var(--text-muted); font-size: 13px; margin: 14px 0; }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 8px; display: none; }
  </style>
  <script src="https://isaiahnoelpulidosalazar.github.io/js/ECStyleSheet.js"></script>
  <script src="https://isaiahnoelpulidosalazar.github.io/js/ECElements.js"></script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-text">🐢 Oogway</div>
      <div class="tagline">Slow and steady, connected forever.</div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="login">Sign In</div>
      <div class="tab" data-tab="register">Register</div>
    </div>

    <!-- Login Form -->
    <div class="form-section active" id="section-login">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="your_username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div class="error-msg" id="login-error"></div>
      <button class="btn btn-primary" id="login-btn">Sign In</button>
    </div>

    <!-- Register Form -->
    <div class="form-section" id="section-register">
      <div class="name-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="reg-firstname" placeholder="John" />
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="reg-lastname" placeholder="Doe" />
        </div>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="john_doe" autocomplete="username" />
        <div class="form-error" id="reg-username-error" style="display:none"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" />
      </div>
      <div class="error-msg" id="reg-error"></div>
      <button class="btn btn-primary" id="reg-btn">Create Account</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="assets/js/api.js"></script>
<script>
(function() {
  // Redirect if already logged in
  if (OogwayAPI.getSession() && OogwayAPI.getUser()) {
    location.href = "app.html";
  }

  // Tabs
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".form-section").forEach(s => s.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById("section-" + tab.dataset.tab).classList.add("active");
    });
  });

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.style.display = "block";
  }
  function hideError(id) {
    const el = document.getElementById(id);
    el.style.display = "none";
  }

  function toast(msg, type) {
    const c = document.getElementById("toast-container");
    const t = document.createElement("div");
    t.className = "toast " + (type || "");
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // Login
  document.getElementById("login-btn").addEventListener("click", async () => {
    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;
    hideError("login-error");
    if (!username || !password) return showError("login-error", "Please fill in all fields.");
    const btn = document.getElementById("login-btn");
    btn.disabled = true; btn.textContent = "Signing in...";
    try {
      await OogwayAPI.Auth.login({ username, password });
      location.href = "app.html";
    } catch (e) {
      showError("login-error", e.message || "Login failed.");
    } finally {
      btn.disabled = false; btn.textContent = "Sign In";
    }
  });

  // Register
  document.getElementById("reg-btn").addEventListener("click", async () => {
    const first_name = document.getElementById("reg-firstname").value.trim();
    const last_name = document.getElementById("reg-lastname").value.trim();
    const username = document.getElementById("reg-username").value.trim();
    const password = document.getElementById("reg-password").value;
    hideError("reg-error");
    document.getElementById("reg-username-error").style.display = "none";
    if (!first_name || !last_name || !username || !password) return showError("reg-error", "All fields are required.");
    if (username.length < 3) return showError("reg-error", "Username must be at least 3 characters.");
    if (password.length < 6) return showError("reg-error", "Password must be at least 6 characters.");
    const btn = document.getElementById("reg-btn");
    btn.disabled = true; btn.textContent = "Creating account...";
    try {
      await OogwayAPI.Auth.register({ first_name, last_name, username, password });
      location.href = "app.html";
    } catch (e) {
      if (e.status === 409) {
        const el = document.getElementById("reg-username-error");
        el.textContent = "Username already taken. Try another!";
        el.style.display = "block";
      } else {
        showError("reg-error", e.message || "Registration failed.");
      }
    } finally {
      btn.disabled = false; btn.textContent = "Create Account";
    }
  });

  // Enter key support
  ["login-username","login-password"].forEach(id => {
    document.getElementById(id).addEventListener("keydown", e => { if(e.key === "Enter") document.getElementById("login-btn").click(); });
  });
})();
</script>
</body>
</html>
